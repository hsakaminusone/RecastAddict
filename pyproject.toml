[project]
name = "recastaddict-patcher"
version = "3.0.0"
description = "Podcast Addict APK patcher (premium unlock, ads/telemetry removal, shrink, re-sign)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.17.0",
  "mypy==1.19.1",
  "bandit==1.9.2",
]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["patcher"]
exclude = [
  "app_src/**",
  ".journal/**",
  "anchors/**",
  "out/**",
  "fixtures/**",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade (py39 target)
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "S",    # flake8-bandit
  "RUF",  # ruff-specific
  "PLW",  # pylint warnings (e.g. subprocess without check=)
  "FURB", # refurb
  "PIE",  # flake8-pie
  "ISC",  # implicit-str-concat
]
ignore = [
  # Intentional: broad excepts in file-parsing / shape-capture paths are
  # robustness guards, always with a comment. Narrowing them breaks on
  # malformed smali from future APK versions.
  # (Kept as global ignore; use `noqa: BLE001` if flake-blind-except is added.)
  "S110", # try-except-pass -> shape capture deliberately ignores unreadable files
  "S112", # try-except-continue, same rationale
  # Subprocess calls check returncode manually to produce actionable
  # BUILD FAIL messages; `check=True` would raise before we can report.
  "PLW1510",
  # Test helper uses asserts; EM101/EM102 (exception string literals) are
  # fine in a patcher that must fail loud with context.
  "EM101",
  "EM102",
  "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "T201"]
"patcher/preflight.py" = ["S603", "S607"]  # invokes pinned toolchain paths, not user input
"patcher/policy.py" = ["S603", "S607"]
"patcher/build.py" = ["S603", "S607"]
"patcher/cli.py" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
mypy_path = "patcher"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.bandit]
exclude_dirs = ["app_src", "out", ".journal", "anchors", "fixtures"]
skips = ["B101"]  # asserts allowed in tests

[tool.pytest.ini_options]
testpaths = ["patcher/tests"]
pythonpath = ["patcher"]
